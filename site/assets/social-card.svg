<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">JLPT MAX Deck</title>
  <desc id="description">단어는 더 깊이, 실전 문제까지. 어휘·음성·한국어 회상·실전 문제를 담은 한국어권 JLPT Anki 덱.</desc>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(982 84) rotate(139) scale(526 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6e3db" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f6e3db" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#f2eee6"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g fill="#a8523a" opacity=".08" font-family="Hiragino Mincho ProN, Yu Mincho, Noto Serif JP, serif" font-size="172" font-weight="600">
    <text x="792" y="164">語</text>
    <text x="972" y="330">解</text>
    <text x="750" y="520">進</text>
  </g>
  <g transform="translate(72 62)">
    <g transform="rotate(-4 48 48)">
      <rect width="96" height="96" rx="24" fill="#a8523a"/>
      <text x="48" y="30" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900" letter-spacing="2" text-anchor="middle">JLPT</text>
      <text x="48" y="69" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" letter-spacing="-2" text-anchor="middle">MAX</text>
    </g>
    <text x="122" y="61" fill="#2b2620" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="35" font-weight="800" letter-spacing="1">JLPT MAX <tspan fill="#a8523a">DECK</tspan></text>
  </g>
  <text x="72" y="285" fill="#2b2620" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="70" font-weight="800" letter-spacing="-3">단어는 더 깊이,</text>
  <text x="72" y="371" fill="#a8523a" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="70" font-weight="800" letter-spacing="-3">실전 문제까지.</text>
  <text x="75" y="432" fill="#7a7166" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="28" font-weight="500">문법·어휘·음성·한국어 회상·실전 문제를 담은 한국어권 JLPT Anki 덱</text>
  <line x1="72" y1="485" x2="1128" y2="485" stroke="#e3dccf" stroke-width="2"/>
  <g fill="#2b2620" font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <text x="74" y="547" font-size="26" font-weight="800">9,160 <tspan fill="#7a7166" font-size="20" font-weight="600">어휘 노트</tspan></text>
    <text x="356" y="547" font-size="26" font-weight="800">7,876 <tspan fill="#7a7166" font-size="20" font-weight="600">실전 문제</tspan></text>
    <text x="638" y="547" font-size="26" font-weight="800">38,970 <tspan fill="#7a7166" font-size="20" font-weight="600">기본 덱 카드</tspan></text>
  </g>
  <rect x="72" y="584" width="1056" height="5" rx="2.5" fill="#a8523a"/>
</svg>
